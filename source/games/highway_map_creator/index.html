<div class="container">
    <div class="map-area">
        <div class="mapBox">
            <canvas id="backgroundCanvas" width="64" height="64"></canvas>
            <canvas id="mainCanvas" width="128" height="128"></canvas>
            <canvas id="poiCanvas" width="512" height="512"></canvas>
            <div class="xSize">
                <button id="decreaseXSize">-</button>
                <input id="xSize" value="1" disabled>
                <button id="increaseXSize">+</button>
            </div>
            <div class="ySize">
                <button id="decreaseYSize">-</button>
                <input id="ySize" value="1" disabled>
                <button id="increaseYSize">+</button>
            </div>
        </div>
        <div id="mapControls">
            Tool:
            <select name="editMode" id="editMode">
                <option value="auto">Auto</option>
                <option value="freeHand">Free Hand</option>
            </select>
            <input type="color" name="color" id="colorPicker">
            <div class="auto toolSection">
                <button id="horizontal" class="selected dirButton">-</button>
                <button id="vertical" class="dirButton">|</button>
            </div>
            <div class="freeHand toolSection">
                <button id="clearMap">Clear Map</button>
                <button id="Upload">Upload Map</button>
                <button id="saveMap">Download Map</button>
            </div>
            <button id="exportMap">Export Map</button>
        </div>
        <div id="mapZoom">
            <button id="zoomOut">-</button>
            <input id="zoomLevel" value="1" disabled>
            <button id="zoomIn">+</button>
        </div>
    </div>
    <div id="objectList">
        <div class="list-header">
            <h2>POIs</h2>
            <button id="addObjectButton">Add Object</button>
        </div>
        <div class="poi-list">
            <div class="list-obj poi-element dummy">
                <div class="drag-icon">
                    <img src="images/drag_handle.png" alt="Drag">
                </div>
                <button class="banner-icon">
                    <img src="images/banners/blue_banner.png" alt="blue banner">
                </button>
                <input type="text" class="obj-name" placeholder="Leave empty for no name">
                <label for="obj-x">X:</label>
                <input type="number" class="obj-x" value="100">
                <label for="obj-z">Z:</label>
                <input type="number" class="obj-z" value="100">
                <button class="remove-obj">Remove</button>
            </div>
            <!-- Object list will be populated here -->
        </div>
        <div class="list-header">
            <h2>Paths</h2>
        </div>
        <div class="path-list">
            <div class="list-obj path-element dummy">
                <div class="drag-icon">
                    <img src="images/drag_handle.png" alt="Drag">
                </div>
                <input type="color" name="pathColor" class="path-color">
                <button class="direction-icon">-</button>
                <label for="startPOI">Start POI:</label>
                <input type="text" class="startPOI" disabled>
                <label for="endPOI">End POI:</label>
                <input type="text" class="endPOI" disabled>
                <button class="remove-obj">Remove</button>
            </div>
            <!-- Path list will be populated here -->
        </div>
    </div>
</div>
<div class="overlay">
    <div id="bannerSelector">
        <!-- Use javascript to dynamically add all banner icons-->
    </div>
</div>
